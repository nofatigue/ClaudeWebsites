<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>כל העצות · נקודה טובה</title>
  <meta name="description" content="כל העצות מרבי נחמן, חב״ד וצדיקי החסידות, לפי נושא: שמחה, נפילות, פחד, תפילה, עין טובה ועשיית טוב.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕯️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=3">
</head>
<body data-section="etzot">
  <header id="site-header"></header>

  <main class="wrap">
    <section style="margin-top:32px">
      <h1>כל העצות</h1>
      <p class="lead" style="margin:0">בחרו נושא או מקור, או חפשו מילה. כל עצה מגיעה עם הסבר פשוט וצעד אחד לעשות.</p>

      <div class="filters">
        <input class="search" id="q" type="search" placeholder="חיפוש: שמחה, פחד, תניא, זושא..." aria-label="חיפוש עצה">
        <div>
          <label class="lbl">נושא</label>
          <div class="chips small" id="f-topic"></div>
        </div>
        <div>
          <label class="lbl">מקור</label>
          <div class="chips small" id="f-who"></div>
        </div>
      </div>

      <div class="count" id="count" aria-live="polite"></div>
      <div class="grid" id="list"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/data.js?v=3"></script>
  <script src="assets/app.js?v=3"></script>
  <script>
  sourcesReady.then(function () {
    const state = { topic: 'all', who: 'all', q: '' };
    const topicChips = [['all', 'הכל', ''], ['favs', 'העצות שלי', '★'], ...Object.entries(TOPICS).map(([k, t]) => [k, t.name, t.e])];
    const whoChips = [['all', 'הכל'], ...Object.entries(TRADITIONS).map(([k, s]) => [k, s.name])];

    const chip = (group, key, label, e = '') =>
      `<button type="button" class="chip" data-${group}="${key}" aria-pressed="${state[group] === key}">${e ? `<span aria-hidden="true">${e}</span>` : ''}${label}</button>`;

    function renderFilters() {
      $('#f-topic').innerHTML = topicChips.map(([k, l, e]) => chip('topic', k, l, e)).join('');
      $('#f-who').innerHTML = whoChips.map(([k, l]) => chip('who', k, l)).join('');
    }

    function render() {
      const q = strip(state.q.trim());
      const favs = Favs.list();
      const items = ETZOT.filter((e) => {
        if (state.topic === 'favs' && !favs.includes(e.id)) return false;
        if (state.topic !== 'all' && state.topic !== 'favs' && !e.topics.includes(state.topic)) return false;
        if (state.who !== 'all' && e.who !== state.who) return false;
        if (q) {
          const hay = strip([e.text, ...e.refs.map((r) => `${srcLabel(r)} ${SRC[r]?.author || ''}`), e.plain, e.act, TRADITIONS[e.who].name, ...e.topics.map((t) => TOPICS[t].name)].join(' '));
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      $('#list').innerHTML = items.map((e) => etzaHTML(e)).join('')
        || `<div class="empty">${state.topic === 'favs' ? 'עוד לא שמרת עצות. לחצו ☆ על עצה שנגעה בכם.' : 'לא נמצאו עצות. נסו מילה אחרת.'}</div>`;
      $('#count').textContent = items.length ? `${items.length} עצות` : '';
    }

    document.addEventListener('click', (ev) => {
      const b = ev.target.closest('.filters .chip');
      if (!b) return;
      if (b.dataset.topic) state.topic = b.dataset.topic;
      if (b.dataset.who) state.who = b.dataset.who;
      renderFilters(); render();
    });
    $('#q').addEventListener('input', (ev) => { state.q = ev.target.value; render(); });
    document.addEventListener('favs-changed', () => { if (state.topic === 'favs') render(); });

    // קישור ישיר לעצה (etzot.html#id) או לנושא (etzot.html#topic=simcha)
    const h = decodeURIComponent(location.hash.slice(1));
    if (h.startsWith('topic=') && TOPICS[h.slice(6)]) state.topic = h.slice(6);
    renderFilters(); render();
    if (h && byId(h)) {
      const el = document.querySelector(`.etza[data-id="${h}"]`);
      if (el) { el.scrollIntoView({ block: 'center' }); el.style.borderColor = 'var(--gold)'; }
    }
  });
  </script>
</body>
</html>
